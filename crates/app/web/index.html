<body>
<header id="topbar">
  <div class="brand"><span class="logo"></span>Curust</div>
  <nav class="stages">
    <button data-stage="prepare" class="active">Prepare</button>
    <button data-stage="preview">Preview</button>
    <button data-stage="monitor">Monitor</button>
  </nav>
  <div class="spacer"></div>
  <button id="printer-btn" class="bar-btn" title="Printer">
    <span class="icon i-printer"></span><span class="label" id="printer-name">Add a printer</span><span class="caret"></span>
  </button>
  <div id="extruder-cards"></div>
  <button id="profile-btn" class="bar-btn profile" title="Print settings">
    <span class="icon i-sliders"></span><span class="label" id="profile-summary">Print settings</span><span class="caret"></span>
  </button>
  <button id="menu-btn" class="bar-btn icon-only" title="Menu"><span class="icon i-menu"></span></button>
</header>
<main id="main">
  <canvas id="view"></canvas>
  <div id="toolbar" class="floating">
    <button data-tool="open" title="Open model files (Ctrl+O)"><span class="icon i-open"></span></button>
    <div class="sep"></div>
    <button data-tool="move" title="Move (T)"><span class="icon i-move"></span></button>
    <button data-tool="scale" title="Scale (S)"><span class="icon i-scale"></span></button>
    <button data-tool="rotate" title="Rotate (R)"><span class="icon i-rotate"></span></button>
    <button data-tool="mirror" title="Mirror (M)"><span class="icon i-mirror"></span></button>
    <button data-tool="permodel" title="Per-model settings"><span class="icon i-permodel"></span></button>
    <button data-tool="blocker" title="Support blocker (E): click a model to block support there"><span class="icon i-blocker"></span></button>
    <div class="sep"></div>
    <button data-tool="delete" title="Delete selected (Del)"><span class="icon i-trash"></span></button>
  </div>
  <div id="tool-panel" class="floating panel" hidden></div>
  <div id="view-buttons" class="floating">
    <button data-view="3d" title="3D view">3D</button>
    <button data-view="front" title="Front view">Front</button>
    <button data-view="top" title="Top view">Top</button>
    <button data-view="left" title="Left view">Left</button>
    <button data-view="right" title="Right view">Right</button>
  </div>
  <div id="object-list" class="floating panel collapsed">
    <div class="ol-head"><span id="ol-title">Object list</span><span class="caret"></span></div>
    <div class="ol-body"></div>
  </div>
  <aside id="settings-panel" class="floating panel" hidden></aside>
  <aside id="printer-panel" class="floating panel popover" hidden></aside>
  <aside id="material-panel" class="floating panel popover" hidden></aside>
  <aside id="menu-panel" class="floating panel popover" hidden></aside>
  <div id="action-panel" class="floating panel"></div>
  <div id="preview-panel" class="floating panel" hidden></div>
  <div id="monitor-panel" class="floating panel" hidden></div>
  <div id="layer-slider" class="floating" hidden>
    <div class="ls-max"><input type="number" id="ls-max-input" min="1"></div>
    <input type="range" id="ls-range" orient="vertical">
    <div class="ls-min"><input type="number" id="ls-min-input" min="1"></div>
  </div>
  <div id="empty-hint" hidden>
    <div class="hint-card" id="hint-card" role="button" tabindex="0" title="Open model files">
      <span class="icon i-open hint-icon"></span>
      <div class="hint-title">Drop STL, OBJ or 3MF files here</div>
      <div class="hint-sub">or click to choose files</div>
    </div>
  </div>
  <div id="drop-overlay" hidden><div>Drop to load models</div></div>
  <div id="toasts"></div>
</main>
<div id="modal-root"></div>
<input type="file" id="file-input" multiple accept=".stl,.obj,.3mf,.png,.jpg,.jpeg,.bmp,.gif" hidden>
<script src="/viewer.js"></script>
<script src="/app.js"></script>
</body>
</html>
