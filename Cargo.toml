[workspace]
resolver = "2"
members = [
    "crates/cppstd",
    "crates/clipper",
    "crates/wagyu",
    "crates/voronoi",
    "crates/engine",
    "crates/cli",
    "crates/settings",
    "crates/pyrt",
    "crates/app",
    "crates/installer",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/WildWetWilly/Curust"

[profile.release]
opt-level = 3
overflow-checks = false
debug = 1
lto = "thin"
codegen-units = 16

[profile.dev]
opt-level = 1
overflow-checks = false

[profile.dev.package."*"]
opt-level = 2
